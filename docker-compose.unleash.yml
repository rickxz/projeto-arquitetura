

services:
  unleash:
    image: unleashorg/unleash-server:latest
    container_name: lab-unleash
    restart: always
    ports:
      - "4242:4242"
    environment:
      - DATABASE_URL=postgres://unleash_user:unleash_pass@unleash-db:5432/unleash
      - DATABASE_SSL=false
      - INIT_FRONTEND_API_TOKENS=*:default.1234567890abcdef
      - INIT_CLIENT_API_TOKENS=*:default.1234567890abcdef
    depends_on:
      - unleash-db
    networks:
      - lab-network

  unleash-db:
    image: postgres:16-alpine
    container_name: lab-unleash-db
    restart: always
    environment:
      - POSTGRES_DB=unleash
      - POSTGRES_USER=unleash_user
      - POSTGRES_PASSWORD=unleash_pass
    volumes:
      - unleash_data:/var/lib/postgresql/data
    networks:
      - lab-network

volumes:
  unleash_data:

networks:
  lab-network:
    external: true
